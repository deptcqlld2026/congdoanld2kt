<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thông báo | Tổ Công đoàn LĐ 2 - KT</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        :root { --primary-color: #004a99; --success-color: #28a745; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: #f8f9fa; margin: 0; display: flex; flex-direction: column; min-height: 100vh; }
        .header { background: var(--primary-color); color: white; text-align: center; padding: 20px 10px; position: relative; }
        .btn-home { position: absolute; top: 15px; left: 10px; background: white; color: var(--primary-color); padding: 5px 10px; border-radius: 5px; text-decoration: none; font-weight: bold; font-size: 12px; }
        .container { max-width: 1000px; margin: 15px auto; background: white; padding: 15px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); flex: 1; width: 95%; box-sizing: border-box; }
        .search-box { width: 100%; padding: 12px 20px; margin-bottom: 20px; border: 1px solid #ddd; border-radius: 25px; font-size: 16px; outline: none; box-sizing: border-box; }
        .card { border: 1px solid #eee; padding: 15px; margin-bottom: 15px; border-radius: 8px; display: flex; flex-direction: column; gap: 10px; transition: 0.3s; }
        @media (min-width: 600px) { .card { flex-direction: row; justify-content: space-between; align-items: center; } }
        .card:hover { background-color: #f1f8ff; border-color: var(--primary-color); }
        .info { flex-grow: 1; }
        .actions { display: flex; gap: 10px; flex-wrap: wrap; }
        .btn { padding: 10px 18px; border-radius: 6px; text-decoration: none; font-weight: 600; cursor: pointer; border: none; font-size: 14px; flex: 1; text-align: center; }
        .btn-view { background-color: var(--primary-color); color: white; }
        .btn-confirm { background-color: var(--success-color); color: white; }
        .footer { background: #333; color: white; text-align: center; padding: 15px 10px; font-size: 13px; width: 100%; box-sizing: border-box; }
    </style>
</head>
<body>
<div class="header">
    <a href="index.html" class="btn-home">🏠 Home</a>
    <h1 style="margin:0; font-size: 1.5rem;">Tổ Công đoàn LĐ 2 - KT</h1>
</div>
<div class="container">
    <h3 style="color: var(--primary-color); text-align: center;">DANH SÁCH THÔNG BÁO</h3>
    <input type="text" id="searchInput" class="search-box" placeholder="Tìm kiếm..." onkeyup="filterFunction()">
    <div id="notificationList"><p style="text-align: center; color: #999;">Đang tải dữ liệu...</p></div>
</div>
<div class="footer">Xây dựng năm 2026 bởi Trần Công Đẹp - Điện thoại 0963292882</div>
<script>
    // Logic Firebase giữ nguyên như v1.4
</script>
</body>
</html>
